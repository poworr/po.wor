<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>po.wor</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="css/style.css?v=23">
</head>
<body>

  <header>
    <!-- Logo (left): bounces on hover and shows its message (data-tip) -->
    <a class="home" href="index.html" data-tip="you want to go home?"><img class="logo" src="images/logo.png" alt="po.wor"></a>

    <!-- Box (right): links to projects.html.
         Hover: the box bounces, the lid opens, the message shows.
         Click: js/box.js tosses a P into it first. -->
    <a class="box" href="projects.html" aria-label="Projects" data-tip="ready to ride">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <!-- box body: left side, bottom, right side -->
        <path d="M4 7.5 L4 16.5 L12 21 L20 16.5 L20 7.5"/>
        <!-- inner edges: the "V" at the top and the line down the middle -->
        <path d="M4 7.5 L12 12 L20 7.5 M12 12 L12 21"/>
        <!-- lid: the diamond on top (its own shape so CSS can tilt it) -->
        <path class="lid" d="M4 7.5 L12 3 L20 7.5 L12 12 Z"/>
      </svg>
    </a>
  </header>

  <main>
    <!-- Your work log. To add one, copy an <article> block and change it. Newest goes on top. -->

    <article class="entry">
      <p class="date">WED-15-07-2026</p>
      <p class="text"><span class="tag">site</span><span class="sep">|</span>Started building po.wor.</p>
    </article>

  </main>

  <footer>&copy; 2026 po.wor</footer>

  <script src="js/box.js?v=5"></script>

</body>
</html>
