<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planner — po.wor</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Same header as the homepage -->
  <header>
    <a class="home" href="index.html" data-tip="you want to go home?"><img class="logo" src="images/logo.png" alt="po.wor"></a>
    <a class="plan" href="planner.html" aria-label="Planner" data-tip="plan something"><span>•</span></a>
    <a class="box" href="box.html" aria-label="box" data-tip="Inside the box">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <path d="M4 7.5 L4 16.5 L12 21 L20 16.5 L20 7.5"/>
        <path d="M4 7.5 L12 12 L20 7.5 M12 12 L12 21"/>
        <path class="lid" d="M4 7.5 L12 3 L20 7.5 L12 12 Z"/>
      </svg>
    </a>
  </header>

  <!-- A plain-text bullet journal. Everything is saved in this browser only. -->
  <main class="planner">

    <div class="planner-bar">
      <span>
        <button data-view="day">day</button>
        <button data-view="week">week</button>
      </span>
      <span>
        <button id="prev" aria-label="Back">&lt;</button>
        <button id="today">today</button>
        <button id="next" aria-label="Forward">&gt;</button>
      </span>
    </div>

    <h1 class="planner-title" id="title"></h1>

    <!-- Day: one row per line (js/planner.js fills it in) -->
    <section id="day-view">
      <div class="doc" id="doc"></div>
    </section>

    <!-- Week: Monday to Sunday, each date with the same rows as the day page (no times) -->
    <section id="week-view" hidden>
      <div id="week"></div>
    </section>

    <!-- The list that pops up while you type (day and week) -->
    <ul class="suggest" id="suggest" hidden></ul>

    <!-- Shows while you hold ⌘ -->
    <pre class="legend" id="legend" hidden></pre>

    <!-- Phones: bullets just above the keyboard -->
    <div class="bullet-bar" id="bullet-bar" hidden></div>
  </main>

  <footer>&copy; 2026 po.wor</footer>

  <script src="js/planner.js"></script>
</body>
</html>
