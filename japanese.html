<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日本語の作文練習 — po.wor</title>
  <link rel="icon" href="images/logo.png">
  <!-- Pixel font (works for Japanese too) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
  <link rel="stylesheet" href="css/mac.css?v=1">
</head>
<body>

  <!-- Menu bar along the top, with the logo (goes home) -->
  <div class="menubar">
    <a href="index.html"><img src="images/logo.png" alt="ホーム"></a>
    <span>po.wor</span>
  </div>

  <!-- The window -->
  <div class="window">
    <div class="titlebar">
      <a class="close" href="projects.html" aria-label="閉じる"></a>
      <h1>日本語の作文練習</h1>
    </div>

    <div class="content">

    <!-- Tabs -->
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-practice" aria-controls="practice" aria-selected="true">練習</button>
      <button class="tab" role="tab" id="tab-good" aria-controls="good" aria-selected="false">お手本</button>
    </div>

    <!-- ===== Part 1: Practice ===== -->
    <section id="practice" role="tabpanel" aria-labelledby="tab-practice">
      <div class="card">
        <p class="level" id="q-level"></p>
        <p class="question" id="q-text"></p>

        <p class="label">キーワード</p>
        <ul class="keywords" id="q-keywords"></ul>
      </div>

      <div class="actions">
        <button class="btn primary" id="next">次の問題</button>
        <button class="btn" id="show-example" aria-expanded="false">お手本を見る</button>
      </div>

      <div class="card example" id="example" hidden></div>
    </section>

    <!-- ===== Part 2: Good Writing ===== -->
    <section id="good" role="tabpanel" aria-labelledby="tab-good" hidden>
      <div id="gallery"></div>
    </section>

    </div>
  </div>

  <script src="js/japanese-data.js?v=3"></script>
  <script src="js/japanese.js?v=3"></script>

</body>
</html>
