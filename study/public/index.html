<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syntax study — po.wor</title>
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <!-- Same header style as the homepage -->
  <header>
    <img class="logo" src="/logo.png" alt="po.wor">
    <span class="muted">Syntax study</span>
  </header>

  <div class="layout">

    <!-- ===== Sidebar: the 9 technologies, with how many you mastered ===== -->
    <nav>
      <ul id="languages"></ul>
    </nav>

    <main>
      <!-- ===== Search, filter, add ===== -->
      <div class="bar">
        <input id="search" type="search" placeholder="Search everything…" aria-label="Search">
        <select id="filter" aria-label="Show">
          <option value="all">All</option>
          <option value="learning">Still learning</option>
          <option value="mastered">Mastered</option>
        </select>
        <button class="btn" id="add">+ Add syntax</button>
      </div>

      <!-- ===== Syntax cards (filled in by app.js) ===== -->
      <div id="cards"></div>

      <!-- ===== Practice Playground ===== -->
      <h2 class="tag" id="playground-title">Playground</h2>
      <textarea id="code" spellcheck="false" placeholder="Type code here. ⌘↵ runs it."></textarea>
      <div class="bar">
        <button class="btn" id="run">Run ⌘↵</button>
        <span class="muted" id="run-note"></span>
      </div>
      <iframe id="preview" sandbox="allow-scripts" title="Result" hidden></iframe>
      <pre id="output"></pre>
    </main>
  </div>

  <footer>&copy; 2026 po.wor</footer>

  <!-- ===== One syntax card. app.js copies this for every item. ===== -->
  <template id="card-template">
    <article class="card">
      <p class="tag category"></p>
      <div class="code-box">
        <pre class="syntax"></pre>
        <button class="btn small copy">Copy</button>
      </div>
      <p class="explain"></p>
      <p class="example muted"></p>
      <div class="card-actions">
        <label><input type="checkbox" class="mastered"> Mastered</label>
        <button class="btn small try">Try it</button>
        <button class="btn small edit">Edit</button>
      </div>
    </article>
  </template>

  <!-- ===== Add / edit form ===== -->
  <dialog id="form-dialog">
    <form id="form">
      <h2 class="tag" id="form-title">Add syntax</h2>
      <input type="hidden" name="id">
      <label>Language <select name="lang" id="form-lang"></select></label>
      <label>Category <input name="category" placeholder="e.g. Loops"></label>
      <label>Syntax <textarea name="syntax" required spellcheck="false"></textarea></label>
      <label>What it does <input name="explain"></label>
      <label>Real-world example <input name="example"></label>
      <div class="bar">
        <button class="btn" type="submit">Save</button>
        <button class="btn" type="button" id="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>

</body>
</html>
